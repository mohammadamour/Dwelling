<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Register for Dwelling - Create your account and start finding your dream home." />
    <meta name="theme-color" content="#0F172A" />
    <title>Register — Dwelling</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-container">
        <div class="auth-card">
          <!-- Back link -->
          <a href="../index.html" class="auth-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back to Home</span>
          </a>

          <!-- Header -->
          <div class="auth-header">
            <div class="auth-header__logo">
              <img src="../images/icons/logo.svg" alt="" aria-hidden="true" />
              <span>Dwelling</span>
            </div>
            <h1 class="auth-header__title">Create Account</h1>
            <p class="auth-header__subtitle">Join thousands of people finding their perfect home</p>
          </div>

          <!-- Error/Success messages -->
          <div id="errorMessage" class="auth-form__error" hidden></div>
          <div id="successMessage" class="auth-form__success" hidden></div>

          <!-- Register Form -->
          <form class="auth-form" id="registerForm">
            <div class="form-group">
              <label for="name" class="form-label">Full Name</label>
              <input
                type="text"
                id="name"
                name="name"
                class="form-input"
                placeholder="John Doe"
                required
                autocomplete="name"
              />
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group">
              <label for="phone" class="form-label">Phone Number (Optional)</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                class="form-input"
                placeholder="+1 (555) 000-0000"
                autocomplete="tel"
              />
            </div>

            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="new-password"
                minlength="6"
              />
            </div>

            <div class="form-group">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="auth-form__checkbox">
              <input type="checkbox" id="role" name="role" value="AGENT" />
              <label for="role">I'm a real estate agent</label>
            </div>

            <div class="auth-form__checkbox">
              <input type="checkbox" id="terms" name="terms" required />
              <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
            </div>

            <div class="auth-form__actions">
              <button type="submit" class="btn btn--primary btn--full">
                <span>Create Account</span>
              </button>
            </div>
          </form>

          <!-- Footer -->
          <div class="auth-form__footer">
            <p class="auth-form__footer-text">
              Already have an account? <a href="login.html" class="auth-form__footer-link">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/register.js"></script>
  </body>
</html>
