<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to Dwelling - Access your account and manage your property searches." />
    <meta name="theme-color" content="#0F172A" />
    <title>Login — Dwelling</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/auth.css?v=demo1" />
    <style>
      /* Demo Credentials Quick Access */
      .auth-demo {
        background: hsl(221 83% 97%);
        border: 1.5px dashed hsl(221 83% 65%);
        border-radius: 1rem;
        padding: 1rem 1.15rem;
        margin-bottom: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .auth-demo__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .auth-demo__title {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: hsl(221 83% 53%);
      }
      .auth-demo__hint {
        font-size: 0.7rem;
        color: hsl(215 16% 47%);
        font-weight: 500;
      }
      .auth-demo__subtitle {
        font-size: 0.8125rem;
        color: hsl(215 16% 40%);
        line-height: 1.4;
        margin: 0;
      }
      .auth-demo__actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.625rem;
        margin-top: 0.25rem;
      }
      .auth-demo__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.6rem 0.75rem;
        background: #ffffff;
        border: 1px solid hsl(214 32% 91%);
        border-radius: 0.5rem;
        font-size: 0.8125rem;
        font-weight: 600;
        color: hsl(222 47% 11%);
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        font-family: inherit;
      }
      .auth-demo__btn:hover {
        border-color: hsl(221 83% 53%);
        background: hsl(221 83% 98%);
        color: hsl(221 83% 53%);
        transform: translateY(-1px);
        box-shadow: 0 4px 8px -1px rgba(37, 99, 235, 0.15);
      }
      .auth-demo__btn:active {
        transform: translateY(0);
      }
      .auth-demo__badge {
        display: inline-block;
        padding: 0.15rem 0.45rem;
        border-radius: 9999px;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        line-height: 1;
      }
      .auth-demo__badge--agent {
        background: hsl(221 83% 90%);
        color: hsl(221 83% 35%);
      }
      .auth-demo__badge--seeker {
        background: hsl(142 71% 90%);
        color: hsl(142 71% 28%);
      }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-container">
        <div class="auth-card">
          <!-- Back link -->
          <a href="../index.html" class="auth-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back to Home</span>
          </a>

          <!-- Header -->
          <div class="auth-header">
            <div class="auth-header__logo">
              <img src="../images/icons/logo.svg" alt="" aria-hidden="true" />
              <span>Dwelling</span>
            </div>
            <h1 class="auth-header__title">Welcome Back</h1>
            <p class="auth-header__subtitle">Sign in to your account to continue</p>
          </div>

          <!-- Demo Credentials Quick Fill for Recruiters & Testing -->
          <div class="auth-demo" id="authDemoCard">
            <div class="auth-demo__header">
              <span class="auth-demo__title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                Demo Quick Access
              </span>
              <span class="auth-demo__hint">1-click test fill</span>
            </div>
            <p class="auth-demo__subtitle">Instant login credentials to test all platform features without creating an account:</p>
            <div class="auth-demo__actions">
              <button type="button" class="auth-demo__btn" id="fillDemoAgentBtn" title="Fill credentials for verified Agent account (can list properties)">
                <span class="auth-demo__badge auth-demo__badge--agent">Agent</span>
                <span>Demo Agent</span>
              </button>
              <button type="button" class="auth-demo__btn" id="fillDemoSeekerBtn" title="Fill credentials for Client account (can book tours & save favorites)">
                <span class="auth-demo__badge auth-demo__badge--seeker">Client</span>
                <span>Demo Client</span>
              </button>
            </div>
          </div>

          <!-- Error/Success messages -->
          <div id="errorMessage" class="auth-form__error" hidden></div>
          <div id="successMessage" class="auth-form__success" hidden></div>

          <!-- Login Form -->
          <form class="auth-form" id="loginForm">
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>

            <div class="auth-form__checkbox">
              <input type="checkbox" id="remember" name="remember" />
              <label for="remember">Remember me</label>
              <a href="#">Forgot password?</a>
            </div>

            <div class="auth-form__actions">
              <button type="submit" class="btn btn--primary btn--full">
                <span>Sign In</span>
              </button>
            </div>

            <div class="auth-form__divider">
              <div class="auth-form__divider-line"></div>
              <span class="auth-form__divider-text">or continue with</span>
              <div class="auth-form__divider-line"></div>
            </div>

            <div class="auth-form__social">
              <button type="button" class="auth-form__social-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Google</span>
              </button>
              <button type="button" class="auth-form__social-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                <span>GitHub</span>
              </button>
            </div>
          </form>

          <!-- Footer -->
          <div class="auth-form__footer">
            <p class="auth-form__footer-text">
              Don't have an account? <a href="register.html" class="auth-form__footer-link">Sign up</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/login.js"></script>
  </body>
</html>
